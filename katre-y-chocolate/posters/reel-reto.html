<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reto</title>
<link rel="stylesheet" href="base.css">
<style>
body,.poster{width:1080px;height:1920px}
.poster{background:radial-gradient(circle at 50% 46%,#3b1a0c 0%,#1e0c06 45%,#070201 100%)}
.ring{position:absolute;left:50%;top:930px;transform:translate(-50%,-50%);width:840px;height:840px;z-index:2}
.top{position:absolute;top:130px;width:100%;text-align:center;z-index:5}
.top .k{font-size:28px;color:#ffbf5e}
.top h1{font-family:Anton;font-size:128px;line-height:.95;margin-top:16px;color:#fff}
.top h1 span{color:#ff4f72;text-shadow:0 0 24px rgba(255,45,85,.8)}
.center{position:absolute;left:0;right:0;top:700px;text-align:center;z-index:5}
.center .a{font-family:Anton;font-size:44px;letter-spacing:.4em;text-indent:.4em;color:#ffd99a}
.center .t{font-family:Anton;font-size:170px;line-height:.86;margin-top:6px}
.center .y{font-family:Yellowtail;font-size:110px;line-height:.6;margin:6px 0 16px}
.center .c{font-family:Anton;font-size:106px;color:#c9773a;-webkit-text-stroke:2.5px #ffd99a}
.timer{position:absolute;left:0;right:0;top:1400px;text-align:center;z-index:5;font-family:Anton;font-size:64px;color:#fff;letter-spacing:.08em}
.timer span{color:#ff4f72}
.rules{position:absolute;left:120px;right:120px;top:1510px;z-index:5;background:rgba(20,8,4,.7);border:2px solid rgba(255,191,94,.4);border-radius:26px;padding:26px 36px}
.rules div{font-size:32px;font-weight:700;line-height:1.6;color:#f6dcc0}
.rules b{font-family:Anton;font-weight:400;color:#ffbf5e;letter-spacing:.06em;margin-right:12px}
.bottom{position:absolute;bottom:130px;width:100%;text-align:center;z-index:5;font-weight:900;font-size:24px;letter-spacing:.3em;color:#e9c9a4}
</style></head><body>
<div class="poster">
  <svg class="ring" viewBox="0 0 960 960">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a95"/><stop offset="1" stop-color="#ff2d55"/></linearGradient></defs>
    <circle cx="480" cy="480" r="430" fill="none" stroke="rgba(255,233,199,.1)" stroke-width="34"/>
    <circle cx="480" cy="480" r="430" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round"
      stroke-dasharray="2702" stroke-dashoffset="430" transform="rotate(-90 480 480)" style="filter:drop-shadow(0 0 18px #ff2d55)"/>
    <circle cx="480" cy="480" r="430" fill="none" stroke="#ffbf5e" stroke-width="34" stroke-linecap="round"
      stroke-dasharray="120 2702" stroke-dashoffset="-2272" transform="rotate(-90 480 480)" style="filter:drop-shadow(0 0 14px #ffbf5e)"/>
    <g stroke="rgba(255,233,199,.35)" stroke-width="4">
      <line x1="480" y1="20" x2="480" y2="58"/><line x1="940" y1="480" x2="902" y2="480"/><line x1="480" y1="940" x2="480" y2="902"/><line x1="20" y1="480" x2="58" y2="480"/>
    </g>
  </svg>
  <div class="top"><div class="k small-caps">RETO</div><h1>¿AGUANTAS<br>HASTA EL <span>FINAL</span>?</h1></div>
  <div class="center"><div class="a">CHEME</div><div class="t gold">KATRE</div><div class="y neon">y</div><div class="c">CHOCOLATE</div></div>
  <div class="timer">FALTA <span>POQUITO</span>…</div>
  <div class="rules">
    <div><b>REGLA 1</b>No la quites.</div>
    <div><b>REGLA 2</b>No la adelantes.</div>
    <div><b>REGLA 3</b>El final no se cuenta.</div>
  </div>
  <div class="bottom">YA DISPONIBLE · TODAS LAS PLATAFORMAS</div>
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="vignette"></div>
</div></body></html>
