<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Expediente</title>
<link rel="stylesheet" href="base.css">
<style>
body,.poster{width:1080px;height:1350px}
.poster{background:radial-gradient(ellipse at 50% 30%,#4a2412 0%,#2a1208 55%,#120603 100%)}
.desk{position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(255,255,255,.02) 0 3px,transparent 3px 22px)}
.lamp{position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(255,190,110,.28),transparent 70%)}
.folder{position:absolute;left:90px;top:150px;width:900px;height:1000px;transform:rotate(-2.2deg);
  background:linear-gradient(180deg,#f3e2c2,#e7cfa4);border-radius:10px;box-shadow:0 30px 60px rgba(0,0,0,.7);padding:70px 70px 0;color:#2a1608}
.tab{position:absolute;top:-52px;left:40px;width:360px;height:60px;background:#e9d4ab;border-radius:12px 12px 0 0;
  font-family:'Special Elite';font-size:28px;padding:14px 26px;color:#5a3418}
.case{font-family:'Special Elite';font-size:30px;letter-spacing:.06em;color:#6a3d1c}
.title{font-family:Anton;font-size:118px;line-height:.95;color:#2a1006;margin:14px 0 30px;letter-spacing:.01em}
.title span{color:#c2183c}
.row{font-family:'Special Elite';font-size:31px;line-height:1.75;border-bottom:1.5px dashed rgba(90,52,24,.35)}
.row b{font-family:Montserrat;font-weight:900;font-size:21px;letter-spacing:.2em;color:#8a5a34;display:inline-block;width:230px}
.decl{margin-top:36px;font-family:Montserrat;font-weight:900;font-size:21px;letter-spacing:.2em;color:#8a5a34}
.bars{margin-top:16px}
.bars div{height:30px;background:#120603;margin:16px 0;border-radius:2px}
.bars .t{font-family:'Special Elite';font-size:30px;background:none;height:auto;color:#2a1608}
.stamp{position:absolute;right:70px;top:930px;transform:rotate(-14deg);border:9px solid #c2183c;color:#c2183c;
  font-family:Anton;font-size:96px;padding:4px 26px;letter-spacing:.06em;opacity:.85;border-radius:10px;mix-blend-mode:multiply}
.stain{position:absolute;width:200px;height:200px;border-radius:50%;border:16px solid rgba(92,44,20,.35);right:110px;bottom:520px;filter:blur(1px)}
.print{position:absolute;left:640px;top:640px;width:120px;height:150px;border-radius:50%;opacity:.5;
  background:repeating-radial-gradient(ellipse at 50% 60%,#5c2c14 0 4px,transparent 4px 9px);transform:rotate(18deg)}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;z-index:5}
.foot .pill{font-size:48px;padding:14px 48px}
.foot p{margin-top:16px;font-size:20px;color:#e9c9a4}
.clip{position:absolute;top:110px;left:520px;width:60px;height:150px;border:8px solid #b9b9b9;border-radius:30px;transform:rotate(8deg);z-index:4;box-shadow:0 4px 8px rgba(0,0,0,.5)}
</style></head><body>
<div class="poster">
  <div class="desk"></div><div class="lamp"></div>
  <div class="clip"></div>
  <div class="folder">
    <div class="tab">EXPEDIENTE N.º 26-11</div>
    <div class="case">CASO ABIERTO · CONFIDENCIAL</div>
    <div class="title">KATRE <span>Y</span><br>CHOCOLATE</div>
    <div class="row"><b>SOSPECHOSO</b>CHEME</div>
    <div class="row"><b>LUGAR</b>Un katre. Uno solo.</div>
    <div class="row"><b>HORA</b>Después de medianoche</div>
    <div class="row"><b>EVIDENCIA</b>Chocolate derretido</div>
    <div class="decl">DECLARACIÓN DEL TESTIGO</div>
    <div class="bars">
      <div class="t">“Empezó dulce, y después…</div>
      <div style="width:96%"></div><div style="width:78%"></div><div style="width:88%"></div>
    </div>
    <div class="print"></div>
    <div class="stain"></div>
  </div>
  <div class="stamp">CLASIFICADO</div>
  <div class="foot"><div class="pill">DESCLASIFÍCALO: ESCÚCHALA COMPLETA</div>
    <p class="small-caps">YA DISPONIBLE · TODAS LAS PLATAFORMAS</p></div>
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="vignette"></div>
</div></body></html>
